mode: deploy

policy:
  # Replace with /150000/pretrained_model after the final checkpoint is copied.
  path: /home/zzx23457/权重/clothes/internvla/100000/pretrained_model
  device: cuda:0

internvla:
  repo: /home/zzx23457/InternVLA-A-series
  vlahost_repo: /home/zzx23457/lerobot_vlahost-main
  python: /home/zzx23457/miniconda3/envs/internvla_a1_5/bin/python
  qwen_path: /home/zzx23457/models/internvla_a1_5/Qwen3.5-2B
  stats_robot_type: marvin
  inference_backend: optimized
  action_loss_only: true
  use_sdpa: true
  compile_model: false
  startup_timeout_s: 300
  max_prompt_length: 650
  image_resolution: [224, 224]
  gripper_min: 0.0
  gripper_max: 1.0
  observation:
    image0: top
    image1: wrist_L
    image2: wrist_R

dataset:
  root: datasets/deploy
  repo_id: local/rollout_internvla_clothes_evaluation
  single_task: "Neatly stack the yellow clothes on the table and place them into the basket on the left."

recording:
  enabled: true
  mode: rosbag
  required: true
  backend_url: http://127.0.0.1:8080
  workspace_setup: /home/zzx23457/ws_apex/install/setup.bash
  raw_root: /home/zzx23457/record_files/deployment_recordings
  dataset_root: /home/zzx23457/record_files/lerobot_datasets/deployment_evaluations
  timeout_s: 5.0
  acquire_timeout_s: 5.0
  fps: 30
  recipe: mcap-gripper-quadtile
  rdp: /home/zzx23457/robot_data_platform/tool/rdp
  robot_type: marvin
  video_codec: h264
  crf: 20
  gop: 2
  keep_raw_after_convert: true
  task: "Neatly stack the yellow clothes on the table and place them into the basket on the left."

robot:
  type: marvain_m6_http
  id: marvin_http_internvla_001
  http_base_url: http://127.0.0.1:8010
  timeout: 5.0
  action_chunk_path: /action_chunk
  default_gripper_pos: 0.0
  joint_names:
    - left_arm_joint_1
    - left_arm_joint_2
    - left_arm_joint_3
    - left_arm_joint_4
    - left_arm_joint_5
    - left_arm_joint_6
    - left_arm_joint_7
    - right_arm_joint_1
    - right_arm_joint_2
    - right_arm_joint_3
    - right_arm_joint_4
    - right_arm_joint_5
    - right_arm_joint_6
    - right_arm_joint_7
    - left_gripper
    - right_gripper
  cameras:
    top:
      type: http
      fps: 30
      width: 640
      height: 480
      color_mode: rgb
    wrist_L:
      type: http
      fps: 30
      width: 640
      height: 480
      color_mode: rgb
    wrist_R:
      type: http
      fps: 30
      width: 640
      height: 480
      color_mode: rgb
  safety_stats_path: /home/zzx23457/internvla_deployment_assets/tj_clothes1
  # The HTTP driver keeps policy joint values in radians despite legacy *_deg names.
  action_clip_margin_deg: 0.05
  max_relative_target_deg: 0.08
  warn_on_observation_out_of_range: true

inference:
  type: chunk
  n_action_steps: 30
  chunk_interval_s: 1.0
  fps: 30.0
  duration: 0.0
  max_steps: 10000
  strategy: base
  interpolation_multiplier: 1
  return_to_initial_position: true
  home_tolerance_rad: 0.12
  home_verify_timeout_s: 12.0
  use_torch_compile: false
  show_cameras: true
  cameras_override:
    - top
    - wrist_L
    - wrist_R
  rtc:
    execution_horizon: 30
    max_guidance_weight: 10.0
