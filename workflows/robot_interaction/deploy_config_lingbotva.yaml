    playback_fps: 6.5
    adaptive_playback: true
    min_playback_fps: 5.0
    max_playback_fps: 12.0
    latency_safety_factor: 1.15
    latency_ema_alpha: 0.25
    log_every_n_frames: 1
  duration: 0.0
  max_steps: 10000
  strategy: base
  interpolation_multiplier: 1
  return_to_initial_position: true
  home_tolerance_rad: 0.12
  home_verify_timeout_s: 12.0
  use_torch_compile: false
  show_cameras: true
  cameras_override:
